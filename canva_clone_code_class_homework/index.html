<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Clone</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: linear-gradient(to bottom, #4a00e0, #8e2de2, #00d2ff);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        main {
            text-align: center;
            margin-top: 100px;
        }
        h1 {
            font-size: 60px;
            margin: 0;
        }
        p {
            font-size: 18px;
            max-width: 600px;
            margin: 20px auto;
        }
        .launch-button {
            background-color: white;
            color: black;
            padding: 15px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 18px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .launch-button span {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Canva</div>
        <div class="nav-links">
            <a href="#">Design</a>
            <a href="#">Product</a>
            <a href="#">Plans</a>
            <a href="#">Business</a>
            <a href="#">Education</a>
            <a href="#">Help</a>
        </div>
    </nav>
    <main>
        <h1>A new era<br>of imagination</h1>
        <p>Discover the latest product launches for the Imagination Era, made to help you dream boldly, create freely, and bring any idea to life.</p>
        <a href="#" class="launch-button">
            <span>▶️</span>
            Watch the launches
        </a>
    </main>
</body>
</html>
